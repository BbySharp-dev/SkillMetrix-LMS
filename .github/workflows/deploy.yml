name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, feat/instructor-cms]
  pull_request:
    branches: [main, develop, feat/instructor-cms]

env:
  REGISTRY: ghcr.io/${{ github.actor }}
  API_IMAGE_NAME: skillmetrix-api
  CLIENT_IMAGE_NAME: skillmetrix-client
  DOTNET_VERSION: '8.0'
  NODE_VERSION: '20'

jobs:
  # ── 1. Build API ───────────────────────────────────────────────────────────
  build-api:
    name: Build API (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore
        working-directory: api

      - name: Build
        run: dotnet build -c Release --no-restore
        working-directory: api

      - name: Test
        run: dotnet test -c Release --no-build --verbosity minimal
        working-directory: api

      - name: Build Docker API image
        run: |
          docker build \
            --tag ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }} \
            --tag ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest \
            api/
        env:
          DOCKER_BUILDKIT: '1'

  # ── 2. Build Client ───────────────────────────────────────────────────────
  build-client:
    name: Build Client (React)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: client

      - name: Type check
        run: pnpm typecheck
        working-directory: client

      - name: Lint
        run: pnpm lint
        working-directory: client

      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: https://api.skillmetrix.dev
        working-directory: client

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 1

  # ── 3. Push API image ──────────────────────────────────────────────────────
  push-api:
    name: Push API Image
    needs: build-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build \
            --tag ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }} \
            --tag ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest \
            api/
          docker push ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest
        env:
          DOCKER_BUILDKIT: '1'

  # ── 4. Deploy to Railway (API) ───────────────────────────────────────────────
  deploy-api:
    name: Deploy API
    needs: push-api
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          railway login --token "$RAILWAY_TOKEN"
          railway up --service api --region singapore

  # ── 5. Deploy to Vercel (Client) ──────────────────────────────────────────
  deploy-client:
    name: Deploy Client to Vercel
    needs: build-client
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Download client artifact
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --prod
          working-directory: client/dist
