name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, feat/instructor-cms]
  pull_request:
    branches: [main, develop, feat/instructor-cms]

env:
  DOTNET_VERSION: '8.0'
  NODE_VERSION: '20'

jobs:
  # ── Build & Test API (.NET) ──────────────────────────────────────────────
  build-api:
    name: Build API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore
        working-directory: api

      - name: Build
        run: dotnet build -c Release --no-restore
        working-directory: api

  # ── Build Client (React/Vite) ───────────────────────────────────────────
  build-client:
    name: Build Client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Cài đặt pnpm trước để setup-node có thể dùng cho việc cache
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 2. Setup Node.js và bật tính năng cache pnpm
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      # 3. Cài đặt các thư viện (dependencies)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: client

      # 4. Chạy Lint để kiểm tra code style
      - name: Lint
        run: pnpm lint
        working-directory: client

      # 5. Kiểm tra Build (CI Check) đảm bảo code không lỗi trước khi deploy
      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: https://skillmetrix-lms-production.up.railway.app/api
        working-directory: client

 # ── Deploy Client to Vercel (Chỉ chạy khi push vào main) ──────────────────
  deploy-client:
    name: Deploy Client to Vercel
    needs: build-client
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Gọi trực tiếp Vercel CLI bản mới nhất (chuẩn chính chủ)
      - name: Deploy to Vercel
        working-directory: client
        env:
          # Vercel sẽ tự động đọc 2 biến này và KHÔNG hỏi [Y/n] nữa
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest --prod --token ${{ secrets.VERCEL_TOKEN }}
